[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdffill"
version = "2026.11.11.0"
dependencies = [
  "pypdf",
  "fillpdf",
  "PyMuPDF>=1.24.3",
]
requires-python = ">=3.8"
authors = [
  {name = "Ernesto Alfonso", email = "erjoalgo@gmail.com"},
]
maintainers = [
  {name = "Ernesto Alfonso", email = "erjoalgo@gmail.com"},
]
description = """Command line utility to manipulate PDF fields. It can list, rename, fill-in or delete PDF fields."""

readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["pdf", "fields", "fill"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/erjoalgo/dotfiles/tree/master/bin/pdffill"
Documentation = "https://github.com/erjoalgo/dotfiles/tree/master/bin/pdffill/README.md"
Repository = "https://github.com/erjoalgo/dotfiles/tree/master/bin/pdffill"
"Bug Tracker" = "https://github.com/erjoalgo/dotfiles/issues"

[project.scripts]
pdffill = "pdffill:main"

[project.entry-points."pdffill.pdffill"]
pdffill = "pdffill:pdffill"